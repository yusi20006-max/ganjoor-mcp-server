name: Zod 4 migration validation

on:
  push:
    branches: [chore/zod4-migration]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate Zod 4 lockfile
        run: npm install --package-lock-only
      - name: Apply non-breaking audit fixes to lockfile
        run: npm audit fix --package-lock-only
      - name: Commit generated lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(deps): regenerate lockfile for Zod 4"
            git push
          fi
      - name: Install exactly from committed lockfile
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Offline tests
        run: npm run test:offline
      - name: Pagination tests
        run: npm run test:pagination
      - name: Context tests
        run: npm run test:context
      - name: Paper-source tests
        run: npm run test:paper-sources
      - name: HTTP security tests
        run: npm run test:http-security
      - name: Live Ganjoor smoke tests
        run: npm test
