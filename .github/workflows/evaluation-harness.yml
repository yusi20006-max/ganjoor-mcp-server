name: Scripted MCP Evaluation

on:
  push:
    branches: [fix/evaluation-q3-current-data]
  pull_request:
    branches: [main]
    paths:
      - tests/verify-evaluation.ts
      - evaluation/evaluation.xml
      - .github/workflows/evaluation-harness.yml
  workflow_dispatch:

jobs:
  scripted-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Run 10 live API evaluation workflows
        run: npx tsx tests/verify-evaluation.ts
